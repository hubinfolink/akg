<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      text-align: center;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* 상단 고정 네비게이션 바 */
    .sticky-nav {
      position: sticky;
      top: 0;
      z-index: 1000;
      background-color: rgba(17, 17, 17, 0.95);
      border-bottom: 1px solid #333;
      backdrop-filter: blur(5px);
      padding: 10px 0;
      text-align: center;
    }

    /* 가로 스크롤 메뉴 영역 */
    .nav-container {
      display: flex;
      overflow-x: auto;
      white-space: nowrap;
      padding: 0 10px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none; /* Firefox 스크롤바 숨김 */
    }

    .nav-container::-webkit-scrollbar {
      display: none; /* Chrome, Safari 스크롤바 숨김 */
    }

    /* 메뉴 아이템 스타일 */
    .nav-item {
      flex: 0 0 auto;
      color: #ccc;
      text-decoration: none;
      font-size: 14px;
      padding: 8px 16px;
      margin: 0 4px;
      border-radius: 20px;
      background: #222;
      border: 1px solid #444;
      transition: all 0.2s ease;
    }

    .nav-item:hover, .nav-item:active {
      color: #ffd700;
      border-color: #ffd700;
    }

    img {
      width: 100%;
      max-width: 1080px;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    /* 텍스트 박스 디자인 */
    .text-box {
      max-width: 1080px;
      margin: 30px auto;
      padding: 30px 20px;
      box-sizing: border-box;
      background: #111111;
      border: 1px solid #333333;
      border-radius: 12px;
      text-align: center;
      width: 90%;
    }

    .text-title {
      font-size: 24px;
      font-weight: bold;
      color: #ffffff;
      margin-bottom: 12px;
    }

    .text-content {
      font-size: 16px;
      line-height: 1.6;
      color: #cccccc;
    }
  </style>
</head>
