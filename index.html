<!DOCTYPE html>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      text-align: center;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

/* 엑셀 셀 형태의 상단 고정 네비게이션 */
.cell-nav {
  position: sticky;
  top: 0;
  z-index: 1000;
  display: flex;
  width: 100%;
  margin: 0;
  padding: 0;
  overflow-x: auto; /* 가로 스크롤 허용 */
  white-space: nowrap; /* 줄바꿈 방지 */
  -webkit-overflow-scrolling: touch; /* 모바일 부드러운 스크롤 */
  scrollbar-width: none; /* Firefox 스크롤바 숨김 */
}

.cell-nav::-webkit-scrollbar {
  display: none; /* Chrome, Safari 스크롤바 숨김 */
}

/* 각 메뉴 항목 (셀) */
.cell-item {
  flex: 0 0 33.333%; /* 한 화면에 딱 3개씩 보이게 고정 (4개 보이게 하려면 25%) */
  display: block;
  padding: 14px 0;
  font-size: 16px;
  font-weight: bold;
  text-decoration: none;
  color: #000000;
  text-align: center;
  box-sizing: border-box;
  border-right: 1px solid rgba(0, 0, 0, 0.1); 
}

    /* 이미지 스타일 */
    img {
      width: 100%;
      max-width: 1080px;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    /* 텍스트 박스 디자인 */
    .text-box {
      max-width: 1080px;
      margin: 30px auto;
      padding: 30px 20px;
      box-sizing: border-box;
      background: #111111;
      border: 1px solid #333333;
      border-radius: 12px;
      text-align: center;
      width: 90%;
    }

    .text-title {
      font-size: 24px;
      font-weight: bold;
      color: #ffffff;
      margin-bottom: 12px;
    }

    .text-content {
      font-size: 16px;
      line-height: 1.6;
      color: #cccccc;
    }
  </style>
</head>
