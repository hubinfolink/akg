<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>무료 회원가입 안내</title>
  <link rel="stylesheet" href="style.css">
  <script src="menu.js"></script>
  <style>
    .benefit-box {
      background: #222;
      border: 2px solid #ffccaa;
      border-radius: 12px;
      padding: 25px 20px;
      margin: 20px auto;
      max-width: 500px;
      text-align: center;
      color: #fff;
    }
    .btn-register-action {
      display: block;
      width: 100%;
      padding: 16px 0;
      background: #ffccaa;
      color: #111;
      font-size: 18px;
      font-weight: bold;
      text-decoration: none;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(255, 204, 170, 0.3);
      transition: transform 0.2s;
      cursor: pointer;
    }
    .btn-register-action:active {
      transform: scale(0.98);
    }

    /* 아이프레임 모달 스타일 */
    .iframe-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      z-index: 9999;
      justify-content: center;
      align-items: center;
    }
    .iframe-container {
      position: relative;
      width: 90%;
      max-width: 800px;
      height: 85vh;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .iframe-container iframe {
      width: 100%;
      height: calc(100% - 40px);
      border: none;
    }
    .iframe-header {
      height: 40px;
      background: #222;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 15px;
    }
    .btn-close-modal {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- 상단 메뉴 -->
  <nav class="cell-nav"></nav>

  <div class="text-box">
    <div class="text-title">🎁 AKG 무료 회원가입 특별 혜택</div>
  </div>

  <div class="text-box">
    <div class="text-title">🔥 지금 가입하시면 나만의 홍보 페이지가 공짜!</div>
  </div>

  <div class="text-box">
    <div class="text-title">🏃️ 당장 가입해서 자리를 선점하세요</div>
  </div>

  <div class="text-box">
    <div class="text-title">🔑 인생이 바뀔 수도 있는 기회</div>
  </div>

  <div class="benefit-box">
    <!-- target="_blank" 제거 및 click 이벤트용으로 변경 -->
    <a id="btn-real-register" class="btn-register-action">🎁 일단 무료 가입하러 가기</a>
  </div>

  <div class="text-box">
    <div class="text-title">
      ⏳망설이지 말고 선점하세요.<br><br>
      🚩 무료 가입 완료 후 랜딩신청 하시면, <strong>지금 보고 계신 랜딩페이지와 똑같은 랜딩페이지를 회원님의 전용 추천인 ID를 적용하여 100% 무료로 발급</strong>해 드립니다.<br><br>
      🔄 랜딩페이지의 업데이트도 자동으로 됩니다.<br>
      🚀 회원님은 이 랜딩페이지만 홍보하면 됩니다.
    </div>
  </div>
  <br><br><br>

  <!-- 하단 메뉴 -->
  <nav class="cell-nav-bottom"></nav>

  <!-- 내부 모달 아이프레임 영역 -->
  <div id="register-modal" class="iframe-modal">
    <div class="iframe-container">
      <div class="iframe-header">
        <span>회원가입</span>
        <button id="btn-close-modal" class="btn-close-modal">&times;</button>
      </div>
      <iframe id="register-iframe" src="" title="회원가입 페이지"></iframe>
    </div>
  </div>

  <script>
    (function() {
      // menu.js 화이트리스트 기준 동기화
      const defaultRef = "KRAQ767727-0";
      const allowedRefs = ["KRAQ917863-0"];

      const urlParams = new URLSearchParams(window.location.search);
      let userRef = urlParams.get('ref') || sessionStorage.getItem('saved_ref');

      // 화이트리스트 검증
      let finalRef = defaultRef;
      if (userRef && allowedRefs.includes(userRef)) {
        finalRef = userRef;
      }

      const registerUrl = `http://user.nextstarglobal.com/Account/Register?ref=${finalRef}`;

      const realRegisterBtn = document.getElementById('btn-real-register');
      const registerModal = document.getElementById('register-modal');
      const registerIframe = document.getElementById('register-iframe');
      const closeModalBtn = document.getElementById('btn-close-modal');

      if (realRegisterBtn) {
        realRegisterBtn.addEventListener('click', function(e) {
          e.preventDefault();
          registerIframe.src = registerUrl;
          registerModal.style.display = 'flex';
        });
      }

      if (closeModalBtn) {
        closeModalBtn.addEventListener('click', function() {
          registerModal.style.display = 'none';
          registerIframe.src = ''; // 닫을 때 iframe 초기화
        });
      }

      // 모달 바깥 영역 클릭 시 닫기
      window.addEventListener('click', function(e) {
        if (e.target === registerModal) {
          registerModal.style.display = 'none';
          registerIframe.src = '';
        }
      });
    })();
  </script>
</body>
</html>
