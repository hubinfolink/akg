<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AKG</title>
<link rel="stylesheet" href="style.css">
  <!-- 메뉴 공통 스크립트 연결 -->
  <script src="menu.js"></script>
</head>
<body>

<!-- 상단 메뉴 자리 -->
  <nav class="cell-nav"></nav>



<div class="container">
  <h2>편하신 채널로 문의해 주세요</h2>

  <!-- 1. 텔레그램 버튼 -->
  <a id="btn-telegram" href="#" target="_blank" class="btn btn-telegram">텔레그램으로 문의하기</a>

  <!-- 2. 카카오톡 버튼 -->
  <a id="btn-kakao" href="https://open.kakao.com/o/sBOSS_KAKAO" target="_blank" class="btn btn-kakao">카카오톡으로 문의하기</a>

  <!-- 3. 문자 수신 전용 버튼 -->
  <a id="btn-sms" href="#" class="btn btn-sms">문자로 문의하기 (어르신 전용)</a>

  <p class="sub-text">상담원 연결 시 가입 및 구매 절차를 친절히 안내해 드립니다.</p>
</div>

<script>
  (function() {
    // 1. URL 및 세션에서 레퍼럴 읽기
    const urlParams = new URLSearchParams(window.location.search);
    let userRef = urlParams.get('ref') || sessionStorage.getItem('saved_ref') || "KRAQ767727-0";

    // 2. 텔레그램 딥링크 조립
    const tgBtn = document.getElementById('btn-telegram');
    if (tgBtn) tgBtn.href = `https://t.me/gene_akg_bot?start=ref_${userRef}`;

    // 3. 문자(SMS) 자동 완성 링크 조립 (보스 번호 세팅)
    const smsBtn = document.getElementById('btn-sms');
    const bossPhone = "01012345678"; // 보스 수신 전용 번호
    const smsText = encodeURIComponent(`[AKG 문의] 추천인코드(${userRef}) 안내를 받고 문의드립니다.`);

    if (smsBtn) {
      // iOS와 안드로이드 호환 문자 링크
      smsBtn.href = `sms:${bossPhone}?body=${smsText}`;
    }
  })();
</script>



<!-- 하단 메뉴 자리 -->
  <nav class="cell-nav-bottom"></nav>

  <!-- 메뉴 자동 삽입 스크립트 (맨 아래 배치) -->
  <script src="menu.js"></script>

</body>
</html>
