<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AKG 문의하기</title>
  <link rel="stylesheet" href="style.css">
  <script src="menu.js" defer></script>
</head>
<body>

  <!-- 상단 메뉴 -->
  <nav class="cell-nav"></nav>

  <div class="text-box">
    <div>
       <a id="btn-telegram" href="#" target="_blank" rel="noopener noreferrer" class="btn btn-telegram">텔레그램으로 문의하기</a>
    </div>
  </div>

  <div class="text-box">
    <div>
       <a id="btn-kakao" href="https://open.kakao.com/o/sBOSS_KAKAO" target="_blank" rel="noopener noreferrer" class="btn btn-kakao">카카오톡으로 문의하기</a>
    </div>
  </div>

  <div class="text-box">
    <div>
       <a id="btn-sms" href="#" class="btn btn-sms">문자 메세지로 문의하기</a>
    </div>
  </div>

  <!-- 하단 메뉴 -->
  <nav class="cell-nav-bottom"></nav>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const userRef = window.FINAL_REF || "KRAQ767727-0";

      // 텔레그램 링크 세팅
      const tgBtn = document.getElementById('btn-telegram');
      const bossTelegramId = "cuntting";
      const tgMsg = encodeURIComponent(`[AKG 문의] 추천인 ID: ${userRef} 보고 문의드립니다.`);
      if (tgBtn) {
        tgBtn.href = `https://t.me/${bossTelegramId}?text=${tgMsg}`;
      }

      // 문자(SMS) 링크 세팅
      const smsBtn = document.getElementById('btn-sms');
      const bossPhone = "01012345678"; // 보스 실제 번호 입력 구간
      const smsText = encodeURIComponent(`[AKG 문의] 추천인 ID: ${userRef} 보고 문의드립니다.`);
      if (smsBtn) {
        smsBtn.href = `sms:${bossPhone}?body=${smsText}`;
      }
    });
  </script>
</body>
</html>
