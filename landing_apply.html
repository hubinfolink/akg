<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <title>무료 랜딩페이지 신청</title>

  <style>
    .form-container {
      width: 100%;
      max-width: 640px;
      margin: 20px auto;

    }
    .form-container iframe {
      width: 100%;
      height: 900px; /* 구글 폼 길이에 맞춰 조절 가능 */
      border: 0;
    }
  </style>
</head>
<body>

  <!-- 상단 메뉴 -->
  <nav class="cell-nav"></nav>

  <div class="text-box">
    <div class="text-title">무료 랜딩페이지 발급 신청</div>
  </div>

  <!-- 구글 폼 iframe 영역 -->
  <div class="form-container">
    <!-- src 부분에 보스의 구글 폼 퍼가기 URL을 입력 -->
    <iframe src="https://forms.gle/hy7kk8a9NQT8Lvgt8/viewform?embedded=true" frameborder="0" marginheight="0" marginwidth="0">로드 중…</iframe>
  </div>

  <!-- 하단 메뉴 -->
  <nav class="cell-nav-bottom"></nav>

  <script src="menu.js"></script>

</html>
