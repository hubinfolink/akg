<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>무료 랜딩페이지 신청</title>
  <link rel="stylesheet" href="style.css">
  <script src="menu.js"></script>
  <style>
    .form-container {
      width: 100%;
      max-width: 640px;
      margin: 20px auto;
      text-align: center;
    }
    .form-container iframe {
      width: 100%;
      height: 900px; /* 구글 폼 길이에 맞춰 조절 가능 */
      border: 0;
    }
  </style>
</head>
<body>

  <!-- 상단 메뉴 -->
  <nav class="cell-nav"></nav>

    <div class="text-box">
      <div class="text-title">🚀 나만의 전용 랜딩페이지 무료 발급</div>
    </div>

    <div class="text-box">
      <div class="text-title">⚔️ 링크 하나로 영업 끝! 강력한 마케팅 무기를 가져가세요</div>
    </div>

    <div class="text-box">
      <div class="text-title">🎁 회원가입만 하면 본인 ID가 매핑된 웹페이지를 공짜로 드립니다.</div>
    </div>




    <!-- 구글 폼 매립 영역 (보스 실 주소 적용) -->
    <div class="form-wrapper">
      <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSd9tRHNZG8QesjTxbgNVH8OPJOVDWbYNyWRGgG0JsglQfDwAg/viewform?embedded=true">로드 중…</iframe>
    </div>


  <!-- 하단 메뉴 -->
  <nav class="cell-nav-bottom"></nav>

  <script src="menu.js"></script>
</body>
</html>
