<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>무료 랜딩페이지 신청</title>
  <link rel="stylesheet" href="style.css">
  <script src="menu.js" defer></script>
  <style>
    .apply-container {
      max-width: 600px;
      margin: 20px auto;
      padding: 0 10px;
    }

    /* 제목과 입력칸을 한 줄(가로) 배치 */
    .form-group {
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
    }
    .form-group label {
      /* 라벨 너비 고정으로 가로 정렬 라인 맞춤 */
      flex: 0 0 170px;
      font-size: 20px;
      font-weight: bold;
      color: #ffccaa;
      white-space: nowrap;
    }
    .form-group label .required {
      color: #ff5555;
      margin-left: 2px;
    }
    .form-group input {
      flex: 1;
      width: 100%;
      padding: 12px;
      background: #111;
      border: 2px solid #ffccaa;
      border-radius: 8px;
      color: #fff;
      font-size: 20px;
      box-sizing: border-box;
      font-weight: bold;
    }
    .form-group input:focus {
      outline: none;
      border-color: #ffffff;
      background: #000;
    }
    .form-group input[readonly] {
      background: #222;
      color: #aaa;
      border-color: #444;
      cursor: not-allowed;
    }
    .btn-submit {
      width: 100%;
      padding: 18px;
      background: #ffccaa;
      color: #111;
      border: none;
      border-radius: 8px;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 15px;
    }
    .btn-submit:hover {
      background: #e6b899;
    }

    /* 초소형 모바일 화면 대응 (폭이 420px 이하일 때 자간 조정) */
    @media (max-width: 420px) {
      .form-group label {
        flex: 0 0 140px;
        font-size: 17px;
      }
      .form-group input {
        font-size: 17px;
        padding: 10px;
      }
    }
  </style>
</head>
<body>

  <!-- 상단 메뉴 -->
  <nav class="cell-nav"></nav>

  <div class="apply-container">
    <div class="text-box">
      <div class="text-title">🚀 나만의 전용 랜딩페이지 100% 무료 발급</div>
      <div class="text-content">본인의 AKG ID만 입력하시면, 본인의 레퍼럴 코드가 적용된 지금 보고 계신 홍보용 랜딩페이지를 무료로 제작·발급해 드립니다.</div>
    </div>

    <div class="text-box">
      <div class="text-title">⚔️ 링크 하나로 영업 끝! 강력한 마케팅 무기를 가져가세요</div>
      <div class="text-content">장점 1: 복잡한 세팅 없이 본인 추천인 링크 완벽 매핑<br>장점 2: SNS 및 온라인 홍보 시 전환율 극대화</div>
    </div>

    <div class="text-box">
      <div class="text-title">🎁 무료가입 후 정회원에게 본인 ID가 매핑된 웹페이지를 공짜로 드립니다.</div>
    </div>

    <!-- 신청서 영역 (상단 복사 바 제거 및 한 줄 정렬 반영) -->
    <div class="text-box">
      <div class="text-title" style="margin-bottom: 25px;">📝 랜딩페이지 무료 신청서</div>

      <form id="applyForm">
        <!-- 1. 상위 파트너 ID (수정 불가 고정) -->
        <div class="form-group">
          <label for="parentRef">상위 파트너 ID <span class="required">*</span></label>
          <input type="text" id="parentRef" name="parentRef" readonly placeholder="자동 매핑 중...">
        </div>

        <!-- 2. 본인의 AKG ID -->
        <div class="form-group">
          <label for="myRef">본인의 AKG ID <span class="required">*</span></label>
          <input type="text" id="myRef" name="myRef" required placeholder="예: KRAQ123456-0">
        </div>

        <!-- 3. 이메일 주소 -->
        <div class="form-group">
          <label for="email">이메일 주소 <span class="required">*</span></label>
          <input type="email" id="email" name="email" required placeholder="example@email.com">
        </div>

        <!-- 4. 휴대폰 번호 (선택) -->
        <div class="form-group">
          <label for="phone">휴대폰 번호 (선택)</label>
          <input type="tel" id="phone" name="phone" placeholder="010-0000-0000">
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">무료 발급 신청하기</button>
      </form>
    </div>
      <div class="text-content">이메일 또는 휴대폰으로 신청자 고유의 랜딩페이지 주소를 보내드립니다. </div>
  </div>

  <!-- 하단 메뉴 -->
  <nav class="cell-nav-bottom"></nav>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // 1. 추천인 ID 자동 매핑
      const parentRefInput = document.getElementById('parentRef');
      const targetRef = window.FINAL_REF || 'KRAQ767727-0';

      if (parentRefInput) parentRefInput.value = targetRef;

      // 2. 폼 제출 처리 (구글 시트로 전송)
      const applyForm = document.getElementById('applyForm');
      const submitBtn = document.getElementById('submitBtn');

      applyForm.addEventListener('submit', function(e) {
        e.preventDefault();

        // 구글 웹 앱 URL 주소 입력
        const GAS_URL = "https://script.google.com/macros/s/AKfycbz7AyM8Qy5COE3VLhzmAaUSGSBw1Mq4XupVVUdvatwLvHS6YIV4olnIg_G9M8OJziZq/exec";

        if (GAS_URL.includes("여기에_구글")) {
          alert("구글 웹 앱 URL을 먼저 코드에 설정해주세요.");
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "전송 중입니다...";

        const payload = {
          parentRef: document.getElementById('parentRef').value,
          myRef: document.getElementById('myRef').value,
          email: document.getElementById('email').value,
          phone: document.getElementById('phone').value,
          userAgent: navigator.userAgent,
          resolution: `${window.screen.width}x${window.screen.height}`,
          timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone,
          referrer: document.referrer || "직접 접속 (Direct)"
        };

        fetch(GAS_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'text/plain;charset=utf-8',
          },
          body: JSON.stringify(payload)
        })
        .then(() => {
          alert("신청이 성공적으로 완료되었습니다!");
          applyForm.reset();
          parentRefInput.value = targetRef; // 리셋 후에도 고정값 유지
        })
        .catch(error => {
          console.error("Error:", error);
          alert("전송에 실패했습니다. 다시 시도해 주세요.");
        })
        .finally(() => {
          submitBtn.disabled = false;
          submitBtn.textContent = "무료 발급 신청하기";
        });
      });
    });
  </script>

</body>
</html>
