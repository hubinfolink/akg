<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>무료 랜딩페이지 신청</title>
  <link rel="stylesheet" href="style.css">
  <script src="menu.js"></script>
  <style>
    .apply-container {
      max-width: 640px;
      margin: 20px auto;
      padding: 0 10px;
    }
    .info-card {
      background: #1e1e1e;
      border: 2px solid #ffccaa;
      border-radius: 12px;
      padding: 20px;
      color: #fff;
      margin-bottom: 25px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .info-card h3 {
      color: #ffccaa;
      margin-top: 0;
      font-size: 18px;
      text-align: center;
      word-break: keep-all;
    }
    .info-card ul {
      padding-left: 20px;
      margin: 15px 0;
      line-height: 1.7;
      color: #ddd;
      font-size: 14px;
    }
    .info-card .highlight {
      color: #22c55e;
      font-weight: bold;
    }
    .form-wrapper {
      width: 100%;
    }
    .form-wrapper iframe {
      width: 100%;
      height: 2000px; /* 폼 항목 전체가 스크롤 없이 시원하게 보이도록 높이 확보 */
      border: 0;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <!-- 상단 메뉴 -->
  <nav class="cell-nav"></nav>
  
  <div class="apply-container">

    <div class="text-box">
      <div class="text-title">🚀 나만의 전용 랜딩페이지 무료 발급</div>
    </div>

    <div class="text-box">
      <div class="text-title">⚔️ 링크 하나로 영업 끝! 강력한 마케팅 무기를 가져가세요</div>
    </div>

    <div class="text-box">
      <div class="text-title">🎁 무료가입만 하면 본인 ID가 매핑된 웹페이지를 공짜로 드립니다.</div>
    </div>
    
  </div>



    <!-- 구글 폼 매립 영역 (보스 실 주소 적용) -->
    <div class="form-wrapper">
      <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSd9tRHNZG8QesjTxbgNVH8OPJOVDWbYNyWRGgG0JsglQfDwAg/viewform?embedded=true">로드 중…</iframe>
    </div>
  </div>

  <!-- 하단 메뉴 -->
  <nav class="cell-nav-bottom"></nav>

  <script src="menu.js"></script>
</body>
</html>
